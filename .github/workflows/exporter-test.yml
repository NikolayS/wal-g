name: Exporter tests

on:
  push:
    paths:
      - 'exporter/**'
      - '.github/workflows/exporter-test.yml'
  pull_request:
    paths:
      - 'exporter/**'
      - '.github/workflows/exporter-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Test exporter
      run: |
        cd exporter
        go mod tidy
        go test -v ./...
        go test -bench=. -benchmem ./...
    
    - name: Build exporter
      run: |
        cd exporter
        go build -o walg-exporter
    
    - name: Test exporter with mock data
      run: |
        cd exporter
        # Create mock WAL-G script for testing
        cat > mock-wal-g << 'EOF'
        #!/bin/bash
        case "$1" in
          "backup-list")
            if [[ "$2" == "--detail" && "$3" == "--json" ]]; then
              echo '[{"backup_name":"base_000000010000000000000001","time":"2024-01-01T12:00:00Z","wal_file_name":"000000010000000000000001","start_lsn":"0/1000000","finish_lsn":"0/2000000","permanent":false,"user_data":"","is_full":true}]'
            fi
            ;;
          "wal-show")
            if [[ "$2" == "--detailed-json" ]]; then
              echo '{"integrity":{"status":"OK","details":[{"timeline_id":1,"start_segment":"000000010000000000000001","end_segment":"000000010000000000000005","segments_count":5,"status":"FOUND"}]},"timeline":{"status":"OK","details":{"current_timeline_id":1,"highest_storage_timeline_id":1}}}'
            fi
            ;;
        esac
        EOF
        chmod +x mock-wal-g
        
        # Test the exporter with mock data
        timeout 10s ./walg-exporter --walg.path=./mock-wal-g --scrape.interval=2s &
        EXPORTER_PID=$!
        
        # Wait for the exporter to start
        sleep 3
        
        # Test metrics endpoint
        curl -s http://localhost:9351/metrics | grep -E "walg_backup_|walg_wal_|walg_lsn_|walg_pitr_"
        
        # Clean up
        kill $EXPORTER_PID || true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        working-directory: exporter
        args: --timeout=5m 